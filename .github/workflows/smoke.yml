name: smoke

# End to end on a clean machine, no API keys: locked install → scaffold → synth score → mix → parallel draft render in
# 16:9 and 9:16 → MP4 checks (scripts/smoke_test.sh). Runs on every push and PR, weekly (catches a vanished pin),
# and on release tags before a GitHub Release is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: ffmpeg
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # the runner's Azure mirror sometimes stalls: fail fast and retry instead of hanging until the job timeout
            APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
            sudo apt-get $APT update -q && sudo apt-get $APT install -yq ffmpeg libsndfile1
          else
            brew install ffmpeg
          fi
      - name: Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.63.0 install-deps chromium-headless-shell
      - name: python syntax
        run: python -m compileall -q scripts
      - name: smoke film
        env:
          MOTION_FILM_HOME: ${{ runner.temp }}/motion-film-home
        run: sh scripts/smoke_test.sh "${{ runner.temp }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-film/renders/*.mp4
          if-no-files-found: ignore
