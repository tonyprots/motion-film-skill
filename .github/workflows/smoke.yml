name: smoke

# End to end on a clean machine, no API keys: locked install → scaffold → synth score → mix → parallel draft render in
# 16:9 and 9:16 → MP4 checks (scripts/smoke_test.sh). Runs on every push and PR, weekly (catches a vanished pin),
# and on release tags before a GitHub Release is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: ffmpeg
        timeout-minutes: 10
        env:
          # Linux: a pinned static build from GitHub instead of apt. apt pulls ~100 packages from the runner's mirror and
          # ran past 12 minutes three times on 2026-10-27. Month-end BtbN builds are kept for about two years; the weekly
          # run catches a vanished pin. libsndfile ships inside the soundfile wheel, so no apt is needed here.
          FFMPEG_TAG: autobuild-2026-09-30-13-08
          FFMPEG_FILE: ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cd "$RUNNER_TEMP"
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$FFMPEG_FILE" \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_FILE"
            echo "$FFMPEG_SHA256  $FFMPEG_FILE" | sha256sum -c -
            mkdir ffmpeg && tar -xJf "$FFMPEG_FILE" -C ffmpeg --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            brew install ffmpeg
          fi
      - name: ffmpeg version
        run: ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1
      - name: Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        run: npx -y playwright@1.63.0 install-deps chromium-headless-shell
      - name: python syntax
        run: python -m compileall -q scripts
      - name: unit tests
        run: python -m unittest discover -s tests
      - name: smoke film
        env:
          MOTION_FILM_HOME: ${{ runner.temp }}/motion-film-home
          MOTION_FILM_NO_UPDATE_CHECK: "1"
        run: sh scripts/smoke_test.sh "${{ runner.temp }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-film/renders/*.mp4
          if-no-files-found: ignore
